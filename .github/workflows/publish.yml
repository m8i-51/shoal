name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI entrypoints are packaged
        run: |
          files=$(npm pack --dry-run --json | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(d[0].files.map(f=>f.path).join('\n'))")
          missing=0
          for f in run.ts diff.ts triage-only.ts server/index.ts server/mcp.ts; do
            if ! printf '%s\n' "$files" | grep -qx "$f"; then
              echo "::error::published package is missing CLI entrypoint: $f (add it to package.json \"files\")"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All CLI entrypoints are present in the package."
          exit $missing

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --access public
