name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is needed to create the GitHub Release below.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI entrypoints are packaged
        run: |
          files=$(npm pack --dry-run --json | node scripts/list-pack-files.js)
          missing=0
          for f in run.ts diff.ts triage-only.ts server/index.ts server/mcp.ts; do
            if ! printf '%s\n' "$files" | grep -qx "$f"; then
              echo "::error::published package is missing CLI entrypoint: $f (add it to package.json \"files\")"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All CLI entrypoints are present in the package."
          exit $missing

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --access public

      # npm had the release notes; GitHub did not. Consumers upgrading
      # 0.1.32 → 0.1.33 had no way to see what changed.
      # Notes go through a file, never through shell interpolation — changelog
      # text is arbitrary and must not be able to run as a command.
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
