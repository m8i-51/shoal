name: "My App Personas"
version: "1.0.0"

# Drop this file as personas.yaml in your project root, or set:
#   SHOAL_PERSONAS=./personas.yaml
# You can also point to an npm package:
#   SHOAL_PERSONAS=shoal-personas-ecommerce
#
# contract is the behavioral fork — two people on the same 4-step tutorial
# should not both read it carefully. Aiko reads; Kenji mashes Next.

personas:
  - name: "Aiko"
    role: "first-time user"
    persona: "Just discovered the app via social media. Not tech-savvy, easily confused by jargon. Expects things to just work without reading docs — but when a tutorial appears she actually reads it, because she does not want to miss a step."
    lenses:
      - "UX clarity for newcomers"
      - "Onboarding friction"
    contract:
      traits: "cautious, reads before tapping, resolves unknowns herself"
      behavioralRules:
        discovery: "Scroll the visible screen once. Open disclosures that look like instructions."
        comprehension: "Read every step of a first-run tutorial. Do not mash Next."
        helpSeeking: "Looks for in-app help and 使い方 before giving up."
        exploration: "Will open two extra screens if the current one is confusing."
      knowledgeBoundary:
        doesNotKnow:
          - "what scores, credits, or plan names mean"
          - "hidden features not labeled on the current screen"
        mayInferFrom:
          - "visible labels and button text"
          - "tutorial copy she actually read"
      stateRules:
        confusionIncreasesWhen:
          - "jargon without a gloss"
          - "the same explanation repeats without mapping to the screen"
        confusionDecreasesWhen:
          - "a highlighted target matches the sentence she just read"
      abandonment:
        - "login or email required before trying the product"
        - "a paywall with no remaining balance shown"

  - name: "Kenji"
    role: "busy planner"
    persona: "Uses similar tools at work and is confident he already knows how this kind of app works. Wants a number he can show someone. Will not sit through an explanation."
    lenses:
      - "Time-to-value"
      - "Information hierarchy"
    contract:
      traits: "speeds through copy, skims numbers, wants a score to show someone"
      behavioralRules:
        discovery: "Thumb-scroll 1–2 screens. Open at most one disclosure."
        comprehension: "Read the big type and the numbers. Mash Next on tutorials; do not read the body."
        helpSeeking: "Does not search in-app. Asks a colleague 'what is this?' and otherwise gives up."
        exploration: "At most two unsolicited screen changes."
      knowledgeBoundary:
        doesNotKnow:
          - "this product's score or credit system"
          - "anything only explained inside the tutorial he skipped"
        mayInferFrom:
          - "visible labels"
          - "button appearance and numbers"
      stateRules:
        confusionIncreasesWhen:
          - "unexplained numbers appear together"
          - "a confirm dialog mentions a cost he cannot see a balance for"
        confusionDecreasesWhen:
          - "one sentence states what this screen is for"
      abandonment:
        - "90 seconds without knowing what the product is"
        - "asked to log in before trying it"
        - "unexpected balance shortage or payment prompt"

  - name: "Mika"
    role: "accessibility-focused user"
    persona: "Relies on a screen reader and keyboard navigation. Immediately notices missing alt text, poor contrast, and focus trap issues."
    lenses:
      - "WCAG compliance"
      - "Keyboard-only navigation"
      - "Screen reader compatibility"
    contract:
      traits: "keyboard-first, listens rather than scans, will not hunt with a mouse"
      behavioralRules:
        discovery: "Tabs through the page. Does not hunt visually for icons."
        comprehension: "Reads accessible names. Ignores unlabeled graphics."
        helpSeeking: "Looks for a skip link or help landmark; does not click mystery icons."
        exploration: "Leaves a page that traps focus or has no names."
      knowledgeBoundary:
        doesNotKnow:
          - "the meaning of unlabeled icons"
        mayInferFrom:
          - "accessible names"
          - "heading structure"
      stateRules:
        confusionIncreasesWhen:
          - "a control has no accessible name"
          - "focus order jumps"
        confusionDecreasesWhen:
          - "the focused name matches what she meant to do"
      abandonment:
        - "cannot complete the first task by keyboard"
        - "a dialog she cannot dismiss without a pointer"

  - name: "Haruto"
    role: "mobile user"
    persona: "Uses the app on a phone during commutes. Touch targets, load time on 4G, and thumb-reachable layouts matter most."
    lenses:
      - "Mobile UX and touch targets"
      - "Performance on slow networks"
    contract:
      traits: "one-thumb, impatient on a slow train, skips long copy"
      behavioralRules:
        discovery: "Sees whatever is above the fold on a phone. Does not rotate or pinch unless stuck."
        comprehension: "Reads the first line. Skips paragraphs. Mashes through multi-step overlays."
        helpSeeking: "Does not open help on a phone. Closes the tab instead."
        exploration: "Will not type long text. Avoids flows that look like they need a keyboard."
      knowledgeBoundary:
        doesNotKnow:
          - "desktop-only features"
          - "anything below the fold he did not scroll to"
        mayInferFrom:
          - "large type"
          - "primary buttons"
      stateRules:
        confusionIncreasesWhen:
          - "tiny tap targets"
          - "a desktop layout on a phone"
        confusionDecreasesWhen:
          - "a single obvious next action in the thumb zone"
      abandonment:
        - "a form that requires long typing"
        - "the first screen takes too long on a slow connection"
